experiment_name: train_chair_lmf

hmc:
  scales: [2, 3]
  q_orders: [0.0, 1.0, 2.0]
  normalization_mode: bbox
  delta: 1.0e-8
  empty_box_epsilon: 1.0e-12
  use_spectrum: false
  spectrum_bins: 0

encoder:
  model_dim: 32
  num_heads: 4
  num_layers: 1
  dropout: 0.0
  window_length: 16

diffusion:
  schedule_type: linear
  beta_start: 1.0e-4
  beta_end: 2.0e-2
  num_timesteps: 1000

data:
  root_dir: ../../ShapeNetCore.v2.PC15k
  categories: [chair]
  split: train
  sample_size: 2048
  batch_size: 2
  num_workers: 0
  pin_memory: true
  random_subsample: true
  drop_last: false

model:
  voxel_size: 8
  patch_size: 2
  in_channels: 3
  out_channels: 3
  input_dim: 16
  model_dim: 32
  depth: 2
  num_heads: 4
  mlp_ratio: 4.0
  class_dropout_prob: 0.1

train:
  seed: 3407
  results_dir: ../results
  learning_rate: 1.0e-4
  weight_decay: 0.0
  epochs: 5
  max_steps:
  log_every: 10
  checkpoint_name: train_checkpoint_lmf.pt
  resume_checkpoint:
  checkpoint_every: 1
  metrics_name: train_metrics.jsonl
  use_l_mf: true
  l_mf_weight: 0.25
  l_mf_hidden_dim: 64
  grad_clip:
  use_amp: true
  prefer_cuda: true
