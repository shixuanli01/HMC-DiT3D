experiment_name: smoke_car_fair_bottleneck

hmc:
  scales: [3, 4, 5]
  q_orders: [1.0, 2.0, 3.0]
  normalization_mode: bbox
  delta: 1.0e-8
  empty_box_epsilon: 1.0e-12
  use_spectrum: false
  spectrum_bins: 0

encoder:
  model_dim: 384
  num_heads: 6
  num_layers: 2
  dropout: 0.0
  window_length: 64

diffusion:
  schedule_type: linear
  beta_start: 1.0e-4
  beta_end: 2.0e-2
  num_timesteps: 1000

data:
  root_dir: ../../ShapeNetCore.v2.PC15k
  categories: [car]
  split: train
  sample_size: 2048
  batch_size: 2
  num_workers: 0
  pin_memory: true
  random_subsample: true
  drop_last: true
  hmc_point_source: full

model:
  model_variant: bottleneck
  voxel_size: 32
  patch_size: 4
  in_channels: 3
  out_channels: 3
  input_dim: 32
  model_dim: 384
  depth: 12
  num_heads: 6
  mlp_ratio: 4.0
  class_dropout_prob: 0.1
  num_bottleneck_latents: 128
  resampler_depth: 4
  resampler_mlp_ratio: 4.0

train:
  seed: 42
  results_dir: ../results
  learning_rate: 1.0e-4
  weight_decay: 0.0
  epochs: 1
  max_steps: 2
  log_every: 1
  checkpoint_name: smoke_checkpoint.pt
  grad_clip: 1.0
  grad_accum_steps: 1
  use_l_mf: false
  l_mf_weight: 0.0
  l_mf_hidden_dim: 128
  min_snr_gamma: 5.0
  hmc_dropout_prob: 0.15
  use_ema: true
  ema_decay: 0.9999
  use_amp: true
  prefer_cuda: true
